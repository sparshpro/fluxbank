#          uri: http://localhost:8083
#          predicates:
#            - Path=/api/payments/**
#          filters:
#            - name: RequestRateLimiter
#              args:
#                redis-rate-limiter.replenishRate: 10
#                redis-rate-limiter.burstCapacity: 20


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

        #Health - Shows whether the application is running properly. (DEFAULT)
        #info - Shows application metadata.
        #prometheus - This exposes metrics in Prometheus format.

  endpoint:
    health:
      show-details: always
      #Show full health details to everyone not just status




springdoc:
  swagger-ui:
    urlsPrimaryName: core-banking-service
    urls:
      - name: core-banking-service
        url: /core-banking-service/v3/api-docs
      - name: advanced-features-service
        url: /advanced-features-service/v3/api-docs








