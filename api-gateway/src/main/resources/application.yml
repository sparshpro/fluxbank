server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak
          issuer-uri: "http://localhost:8085/realms/master"

  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
          routes:
            - id: core-banking-service
              uri: http://localhost:8081
              predicates:
                - Path=/core-banking-service/**
              filters:
                - StripPrefix=1

            - id: advanced-features-service
              uri: http://localhost:8082
              predicates:
                - Path=/advanced-features-service/**
              filters:
                - StripPrefix=1






  # Rate limiter
